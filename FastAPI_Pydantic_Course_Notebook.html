<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FastAPI &amp; Pydantic Course Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky XP header, chapter rail on the left (chips on phone), one chapter "level" at a time in the main column */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e9efed; --ink:#13201e; --muted:#566664; --line:#d7e1de;
  --accent:#00796b; --accent-ink:#ffffff; --accent-soft:#d6efea;
  --xp:#b86e00; --xp-soft:#fbecd2;
  --ok:#2e7d32; --ok-soft:#dcf0dd; --err:#c0392b; --err-soft:#f8dedb;
  --get:#1f6fd1; --post:#2e8b57; --put:#c27c0e; --del:#c0392b;
  --pg:#336791; --pg-soft:#dde8f3;
  --code-bg:#0f1918; --code-fg:#dbe7e4; --code-kw:#7fd1c4; --code-str:#f0c674; --code-com:#6f8783; --code-dec:#c7a0f0; --code-num:#f59f7a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1312; --surface:#131e1d; --sunk:#0f1817; --ink:#e2ebe8; --muted:#93a5a1; --line:#24332f;
  --accent:#3cc4b0; --accent-ink:#06211d; --accent-soft:#163a35;
  --xp:#f1a83c; --xp-soft:#3a2a10;
  --ok:#6cc070; --ok-soft:#173219; --err:#ef7b6e; --err-soft:#3c1915;
  --get:#6aa8f5; --post:#5fc58b; --put:#eab14f; --del:#ef7b6e;
  --pg:#7aa7d6; --pg-soft:#16304a;
  --code-bg:#08100f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1312; --surface:#131e1d; --sunk:#0f1817; --ink:#e2ebe8; --muted:#93a5a1; --line:#24332f;
  --accent:#3cc4b0; --accent-ink:#06211d; --accent-soft:#163a35;
  --xp:#f1a83c; --xp-soft:#3a2a10;
  --ok:#6cc070; --ok-soft:#173219; --err:#ef7b6e; --err-soft:#3c1915;
  --get:#6aa8f5; --post:#5fc58b; --put:#eab14f; --del:#ef7b6e;
  --pg:#7aa7d6; --pg-soft:#16304a;
  --code-bg:#08100f; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
code,pre,.mono{font-family:var(--f-mono)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;flex:none}
.brand h1{font-size:1.25rem;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:.8rem;line-height:1.2}
.xpbox{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:12px}
.lvl{font-family:var(--f-display);font-weight:700;white-space:nowrap;font-size:.95rem}
.lvl span{color:var(--xp)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;width:0;background:var(--xp);border-radius:99px;transition:width .5s ease}
.xpnum{font-family:var(--f-mono);font-size:.85rem;color:var(--xp);white-space:nowrap;font-variant-numeric:tabular-nums}

/* shell */
.shell{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start;display:flex;flex-direction:column;gap:4px}
.rail .sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 8px 4px;font-weight:600}
.rail .sec:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:10px;padding:7px 10px;color:var(--ink);font-size:.92rem}
.nav:hover{background:var(--sunk)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-family:var(--f-mono);flex:none;color:var(--muted)}
.nav.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.nav .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{min-width:0}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px;scrollbar-width:thin}
  .rail .sec{display:none}
  .nav{flex:none;border:1px solid var(--line);background:var(--surface)}
  .nav .t{display:none}
  .nav.wide .t{display:inline}
}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.stack{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600}
.chhead{display:flex;flex-direction:column;gap:10px}
.chhead h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.xp{background:var(--xp-soft);color:var(--xp);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.goal{font-size:1.08rem;max-width:68ch}
h3{font-size:1.15rem;font-weight:700;margin-bottom:10px}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding:0;margin:0;list-style:none}
.covers li{background:var(--sunk);border-radius:10px;padding:9px 12px;font-size:.93rem;display:flex;gap:8px}
.covers li::before{content:"→";color:var(--accent);font-weight:700}
.prose p{margin:0 0 10px;max-width:70ch}
.prose p:last-child{margin-bottom:0}
.prose code,.covers code,.checks code,.quiz code{background:var(--sunk);padding:1px 5px;border-radius:5px;font-size:.88em}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* code */
.code{border-radius:12px;overflow:hidden;background:var(--code-bg);color:var(--code-fg)}
.code-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--f-mono);font-size:.78rem;color:#9fb3af}
.code-h button{background:rgba(255,255,255,.08);color:#dbe7e4;border:0;border-radius:6px;padding:3px 10px;font-size:.75rem}
.code-h button:hover{background:rgba(255,255,255,.16)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-size:.84rem;line-height:1.6;tab-size:4}
.k{color:var(--code-kw)} .s{color:var(--code-str)} .c{color:var(--code-com);font-style:italic} .d{color:var(--code-dec)} .nu{color:var(--code-num)}


/* checks */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.checks label:hover{background:var(--sunk)}
.checks input{width:20px;height:20px;accent-color:var(--ok);margin-top:2px;flex:none}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.checks .pts{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;color:var(--xp);white-space:nowrap}

/* quiz */
.q{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q p.qt{margin:0;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.opt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font-size:.93rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--err-soft);border-color:var(--err);color:var(--ink)}
.opt:disabled{cursor:default}
.why{font-size:.9rem;color:var(--muted);margin:0}
.why b{color:var(--ink)}

.navrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}

.complete{display:flex;align-items:center;gap:14px;background:var(--ok-soft);border-radius:14px;padding:14px 18px}
.medal{width:52px;height:52px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;flex:none}

/* roadmap */
.hero h2{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;max-width:18ch}
.hero p{max-width:62ch;color:var(--muted);font-size:1.05rem;margin:10px 0 0}
.timeline{display:flex;height:46px;border-radius:10px;overflow:hidden;gap:2px}
.seg{border:0;padding:0;color:#fff;font-family:var(--f-mono);font-size:.75rem;font-weight:600;min-width:0;opacity:.9}
.seg:hover{opacity:1}
.seg.s1{background:#1f6fd1}.seg.s2{background:#2e8b57}.seg.s3{background:#8e5bd0}.seg.s4{background:#c27c0e}
.seg.done{box-shadow:inset 0 -6px 0 rgba(0,0,0,.35)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.grid2>*{min-width:0}

.ep{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-family:var(--f-mono);font-size:.82rem}
.ep + .ep{margin-top:6px}
.ep.locked{opacity:.45}
.ep .pth{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mth{font-weight:700;font-size:.7rem;padding:3px 0;width:58px;text-align:center;border-radius:5px;color:#fff;flex:none}
.mth.GET{background:var(--get)}.mth.POST{background:var(--post)}.mth.PUT{background:var(--put)}.mth.DELETE{background:var(--del)}
.lock{font-size:.72rem;color:var(--muted);white-space:nowrap}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.75rem;color:var(--muted)}
.badge .b{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);font-family:var(--f-display);font-weight:800;color:var(--muted)}
.badge.got{color:var(--ink)}
.badge.got .b{border:0;background:var(--xp);color:var(--surface);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* playground */
.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
select,input[type=text],textarea{font:inherit;font-family:var(--f-mono);font-size:.88rem;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.resp{border-radius:12px;background:var(--code-bg);color:var(--code-fg);overflow:hidden}
.status{font-family:var(--f-mono);font-weight:700;padding:2px 9px;border-radius:6px;font-size:.8rem}
.st2{background:#2e8b57;color:#fff}.st4{background:#c0392b;color:#fff}.st0{background:#55625f;color:#fff}
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mis{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.88rem}
.mis .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.mis.got{background:var(--ok-soft);border-color:transparent}
.mis.got .dot{background:var(--ok);border-color:var(--ok)}
@media (max-width:520px){.req{grid-template-columns:1fr 1fr}.req input{grid-column:1/-1;order:3}}

/* chapter 7 connection diagram */
.fw-tabs{display:flex;gap:8px;flex-wrap:wrap}
.fw-tabs .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fw{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1000px){.fw{grid-template-columns:minmax(0,1fr)}}
.fw-grp{position:relative;border:1.5px dashed var(--accent);border-radius:14px;padding:24px 10px 10px}
.fw-grp.pg{border-color:var(--pg)}
.fw-grp>.fw-gt{position:absolute;top:-10px;left:12px;background:var(--surface);padding:0 7px;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.fw-grp.pg>.fw-gt{color:var(--pg)}
.fw-nd{display:flex;gap:11px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;transition:border-color .3s,box-shadow .3s,transform .3s,opacity .4s}
.fw-ic{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.fw-nd.pg .fw-ic{background:var(--pg-soft);color:var(--pg)}
.fw-nd.cl .fw-ic{background:var(--xp-soft);color:var(--xp)}
.fw-nd b{display:block;font-family:var(--f-display);font-size:.95rem;line-height:1.25}
.fw-nd small{display:block;color:var(--muted);font-size:.8rem;line-height:1.35}
.fw-rows{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:99px;font-family:var(--f-mono);font-size:.72rem;background:var(--pg-soft);color:var(--pg)}
.fw-nd.on{border-color:var(--xp);box-shadow:0 0 0 4px color-mix(in srgb,var(--xp) 22%,transparent);transform:translateX(4px)}
.fw-nd.ghost{opacity:.35;border-style:dashed;box-shadow:none;transform:none}
.fw-wr{height:34px;width:2px;margin-left:31px;background:var(--line);position:relative;transition:background .3s}
.fw-wr.on{background:var(--xp)}
.fw-wr.on::after{content:"";position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--xp);animation:fwdown 1.1s linear infinite}
.fw-wr.on.up::after{animation-name:fwup}
.fw-wl{position:absolute;left:18px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--f-mono);font-size:.74rem;font-weight:600;color:var(--xp);opacity:0;transition:opacity .3s}
.fw-wr.on .fw-wl{opacity:1}
@keyframes fwdown{from{top:-6px}to{top:calc(100% - 6px)}}
@keyframes fwup{from{top:calc(100% - 6px)}to{top:-6px}}
.fw-pn{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--bg)}
.fw-pm{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fw-pm span:first-child{color:var(--xp)}
.fw-pn h4{margin:0;font-family:var(--f-display);font-size:1.3rem;line-height:1.2;text-wrap:balance}
.fw-sy{margin:0;padding:10px 12px;border-radius:10px;background:var(--xp-soft);color:var(--ink);font-size:.95rem}
.fw-sy strong{color:var(--xp)}
.fw-ex{margin:0;max-width:62ch}
.fw-lb{margin:0 0 6px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fw-pn pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:12px 14px;font-size:.82rem;line-height:1.6;overflow-x:auto;white-space:pre}
.fw-pn pre.sql{border-left:3px solid var(--pg)}
.fw-ns{margin:0;color:var(--muted);font-style:italic;font-size:.92rem}
.fw-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fw-ctl .btn:disabled{opacity:.4;cursor:default}
.fw-dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.fw-dots button{width:12px;height:12px;padding:0;border:0;border-radius:50%;background:var(--line)}
.fw-dots button.on{background:var(--xp)}.fw-dots button.past{background:color-mix(in srgb,var(--xp) 45%,var(--line))}
.fw-rule{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-radius:10px;background:var(--sunk);font-size:.9rem}
.fw-rule span{font-family:var(--f-mono);font-size:.82rem}.fw-rule i{font-style:normal;color:var(--xp);font-weight:600}
@media (prefers-reduced-motion:reduce){.fw-wr.on::after{top:calc(50% - 6px)}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><div class="logo">F</div><div><h1>FastAPI &amp; Pydantic</h1><small>Complete course notebook</small></div></div>
    <div class="xpbox">
      <div class="lvl">Lv <span id="lvlNum">1</span> · <span id="lvlName">Hello World</span></div>
      <div class="bar" aria-hidden="true"><i id="xpBar"></i></div>
      <div class="xpnum"><span id="xpNow">0</span> / <span id="xpMax">0</span> XP</div>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Course sections"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ------------------------------------------------------------------ content */
const STAGES = {
  s1:{name:"FastAPI basics on JSON", color:"#1f6fd1"},
  s2:{name:"Pydantic + CRUD", color:"#2e8b57"},
  s3:{name:"Database", color:"#8e5bd0"},
  s4:{name:"Docker + deploy", color:"#c27c0e"}
};

const DATASET = `{
  "S001": {"name": "Aarav Sharma", "age": 20, "email": "aarav@example.com", "course": "Python", "marks": 85},
  "S002": {"name": "Priya Patel", "age": 22, "email": "priya@example.com", "course": "Web Development", "marks": 92},
  "S003": {"name": "Rohan Verma", "age": 21, "email": "rohan@example.com", "course": "Data Science", "marks": 67},
  "S004": {"name": "Sneha Reddy", "age": 19, "email": "sneha@example.com", "course": "Python", "marks": 74},

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hl(code, lang){
  if(lang==="text") return esc(code);
  const kw = "def|class|return|if|elif|else|for|in|not|import|from|with|as|try|except|finally|yield|raise|True|False|None|and|or|lambda";
  const dockerKw = "FROM|WORKDIR|COPY|RUN|EXPOSE|CMD";
  const parts = [
    "(#[^\\n]*)",
    "(\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*')",
    lang==="python" ? "(@\\w+)" : "(@@never@@)",
    lang==="python" ? "\\b("+kw+")\\b" : lang==="docker" ? "^("+dockerKw+")\\b" : "(@@never@@)",
    "\\b(\\d+)\\b"
  ];
  const re = new RegExp(parts.join("|"), "gm");
  let out = "", last = 0, m;
  const isJson = lang==="json";
  while((m = re.exec(code))){
    if(m[1] && isJson){ continue; }
    out += esc(code.slice(last, m.index));
    const cls = m[1]?"c":m[2]?"s":m[3]?"d":m[4]?"k":"nu";
    out += '<span class="'+cls+'">'+esc(m[0])+'</span>';
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

function chapterComplete(c){
  return c.checks.every((_,i)=>S.checks[c.id+"-"+i]) && c.quiz.every((_,i)=>S.quiz[c.id+"-"+i] && S.quiz[c.id+"-"+i].solved);
}
function renderChapter(id){
  const c = CH.find(x=>x.id===id);
  const idx = CH.indexOf(c);
  const checks = c.checks.map((t,i)=>{ const k=c.id+"-"+i; return `<li><label><input type="checkbox" id="ck${k}" data-check="${k}" ${S.checks[k]?'checked':''}><span>${t}</span><span class="pts">+${XP.check} XP</span></label></li>`; }).join("");
  const quiz = c.quiz.map((q,i)=>{
    const k=c.id+"-"+i, st=S.quiz[k];
    const opts = q.o.map((o,j)=>{ let cls=""; if(st && st.solved && j===q.a) cls="right"; return `<button class="opt ${cls}" data-q="${k}" data-o="${j}" ${st&&st.solved?'disabled':''}>${o}</button>`; }).join("");
    return `<div class="q" id="q${k}"><p class="qt">${i+1}. ${q.q}</p><div class="opts">${opts}</div><p class="why" ${st&&st.solved?'':'hidden'}><b>Why:</b> ${q.w}</p></div>`;
  }).join("");
  const eps = ENDPOINTS.filter(e=>e.ch===c.id);
  const complete = S.done[c.id];
  $("#main").innerHTML = `<div class="stack">
    <section class="panel chhead">
      <span class="eyebrow">Chapter ${c.id} of ${CH.length} · ${STAGES[c.stage].name}</span>
      <h2>${c.title}</h2>
      <div class="meta"><span class="chip xp">Badge: ${c.badge}</span>${complete?'<span class="chip ok">Completed</span>':''}</div>
      <p class="goal" style="margin:0">${c.goal}</p>
    </section>
    ${complete?`<div class="complete"><div class="medal">${c.abbr}</div><div><b>Chapter complete.</b> You earned the “${c.badge}” badge${eps.length?` and unlocked ${eps.map(e=>e.m+' '+esc(e.p)).join(', ')}`:''}.</div></div>`:''}
    <section class="panel"><h3>What this chapter covers</h3><ul class="covers">${c.covers.map(x=>`<li><span>${x}</span></li>`).join("")}</ul></section>
    <section class="panel prose"><h3>The idea in plain words</h3>${c.concept}</section>
    ${c.flow?FLOW_HTML:""}
    <section class="panel"><h3>Checkpoint</h3><ul class="checks">${checks}</ul></section>
    <section class="panel stack"><h3 style="margin:0">Quick quiz <span class="chip xp" style="vertical-align:middle">+${XP.quiz} XP for a first-try answer</span></h3>${quiz}</section>
    <div class="navrow">
      ${idx>0?`<button class="btn" data-go="ch${CH[idx-1].id}">← ${CH[idx-1].title}</button>`:`<button class="btn" data-go="home">← Roadmap</button>`}
      ${idx<CH.length-1?`<button class="btn primary" data-go="ch${CH[idx+1].id}">${CH[idx+1].title} →</button>`:`<button class="btn primary" data-go="play">Open the Playground →</button>`}
    </div>
  </div>`;
  if(c.flow) fwInit();
}
function checkComplete(id){
  const c = CH.find(x=>x.id===id);
  if(!S.done[id] && chapterComplete(c)){
    S.done[id]=true; save(); toast(`Chapter ${id} complete! +${XP.chapter} XP · Badge: ${c.badge}`);
    renderChapter(id); renderRail(); renderHeader();
  }
}

function err(type, loc, msg, input){ return {type, loc, msg, input}; }
function validate(obj, partial){
  const errs=[], out={};
  const spec = {
    id:{t:"str"}, name:{t:"str",max:50}, age:{t:"int",gt:0,lt:100}, email:{t:"email"}, course:{t:"str"}, marks:{t:"int",ge:0,le:100}
  };
  const fields = partial ? ["name","age","email","course","marks"] : Object.keys(spec);
  fields.forEach(f=>{
    const s = spec[f]; let v = obj[f];
    if(v===undefined){ if(!partial) errs.push(err("missing",["body",f],"Field required",obj)); return; }
    if(v===null && partial){ out[f]=null; return; }
    if(s.t==="int"){
      if(typeof v==="string" && /^-?\d+$/.test(v.trim())) v=parseInt(v,10);
      if(typeof v!=="number" || !Number.isInteger(v)){ errs.push(err("int_parsing",["body",f],"Input should be a valid integer",v)); return; }
      if(s.gt!==undefined && !(v>s.gt)) errs.push(err("greater_than",["body",f],`Input should be greater than ${s.gt}`,v));
      else if(s.lt!==undefined && !(v<s.lt)) errs.push(err("less_than",["body",f],`Input should be less than ${s.lt}`,v));
      else if(s.ge!==undefined && !(v>=s.ge)) errs.push(err("greater_than_equal",["body",f],`Input should be greater than or equal to ${s.ge}`,v));
      else if(s.le!==undefined && !(v<=s.le)) errs.push(err("less_than_equal",["body",f],`Input should be less than or equal to ${s.le}`,v));
      else out[f]=v;
    } else {
      if(typeof v!=="string"){ errs.push(err("string_type",["body",f],"Input should be a valid string",v)); return; }
      if(s.t==="email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){ errs.push(err("value_error",["body",f],"value is not a valid email address",v)); return; }
      if(s.max && v.length>s.max){ errs.push(err("string_too_long",["body",f],`String should have at most ${s.max} characters`,v)); return; }
      out[f] = f==="name" ? v.trim().replace(/\s+/g," ").toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase()) : v;
    }
  });
  return {errs,out};
}
function mission(id){ if(!S.missions[id]){ S.missions[id]=true; save(); toast(`Mission complete! +${XP.mission} XP`); renderHeader(); renderMissions(); } }
function handle(method, path, bodyText){
  let u; try{ u = new URL(path.startsWith("/")?path:"/"+path, "http://127.0.0.1:8000"); }catch(e){ return [404,{detail:"Not Found"}]; }
  const p = u.pathname.replace(/\/+$/,"") || "/", q = u.searchParams;
  let body = null;
  if(method==="POST"||method==="PUT"){
    try{ body = JSON.parse(bodyText||""); }catch(e){ mission("m422"); return [422,{detail:[{type:"json_invalid",loc:["body",0],msg:"JSON decode error"}]}]; }
    if(typeof body!=="object"||body===null||Array.isArray(body)){ mission("m422"); return [422,{detail:[{type:"model_attributes_type",loc:["body"],msg:"Input should be a valid dictionary or object"}]}]; }
  }
  if(p==="/" && method==="GET") return [200,{message:"Welcome to the Student Management API"}];
  if(p==="/about" && method==="GET") return [200,{message:"A simple API to manage student records"}];
  if(p==="/sort" && method==="GET"){
    const sb=q.get("sort_by"), ord=q.get("order")||"asc";
    if(sb===null){ mission("m422"); return [422,{detail:[{type:"missing",loc:["query","sort_by"],msg:"Field required",input:null}]}]; }
    if(!["marks","age"].includes(sb)) return [400,{detail:"sort_by must be 'marks' or 'age'"}];
    if(!["asc","desc"].includes(ord)) return [400,{detail:"order must be 'asc' or 'desc'"}];
    if(sb==="marks") mission("msort");
    const arr = Object.values(DB).sort((a,b)=>a[sb]-b[sb]); if(ord==="desc") arr.reverse(); return [200,arr];
  }
  if(p==="/students"){
    if(method==="GET"){
      const c=q.get("course");
      if(c){ const r={}; Object.entries(DB).forEach(([k,v])=>{ if(v.course.toLowerCase()===c.toLowerCase()) r[k]=v; }); mission("mfilter"); return [200,r]; }
      return [200,DB];
    }
    if(method==="POST"){
      const {errs,out}=validate(body,false);
      if(errs.length){ mission("m422"); return [422,{detail:errs}]; }
      if(DB[out.id]) return [400,{detail:"Student already exists"}];
      const {id,...rest}=out; DB[id]=rest; mission("mpost"); return [201,{message:"Student created"}];
    }
    return [405,{detail:"Method Not Allowed"}];
  }
  const m = p.match(/^\/students\/([^/]+)$/);
  if(m){
    const id = decodeURIComponent(m[1]);
    if(!["GET","PUT","DELETE"].includes(method)) return [405,{detail:"Method Not Allowed"}];
    if(method==="PUT"){ const {errs}=validate(body,true); if(errs.length){ mission("m422"); return [422,{detail:errs}]; } }
    if(!DB[id]){ mission("m404"); return [404,{detail:"Student not found"}]; }
    if(method==="GET"){ mission("m200"); return [200,DB[id]]; }
    if(method==="PUT"){ const {out}=validate(body,true); Object.assign(DB[id],out); mission("mput"); return [200,{message:"Student updated",student:DB[id]}]; }
    delete DB[id]; mission("mdel"); return [200,{message:"Student deleted"}];
  }
  return [404,{detail:"Not Found"}];
}
function renderMissions(){
  const el = $("#missions"); if(!el) return;
  el.innerHTML = MISSIONS.map(x=>`<div class="mis ${S.missions[x.id]?'got':''}"><span class="dot"></span>${x.t}</div>`).join("");
}
function renderPlay(){
  $("#main").innerHTML = `<div class="stack">
    <section class="panel chhead">
      <span class="eyebrow">Practice</span>
      <h2>API Playground</h2>
      <p class="goal" style="margin:0">A pretend version of the finished JSON API (end of Chapter 6), running right in this page. Send requests, break things on purpose, and read the responses exactly like you would in <code>/docs</code>.</p>
    </section>
    <section class="panel"><h3>Missions <span class="chip xp" style="vertical-align:middle">+${XP.mission} XP each</span></h3><div class="missions" id="missions"></div></section>
    <section class="panel stack">
      <div class="presets">${PRESETS.map((x,i)=>`<button class="btn small" data-preset="${i}"><span class="mth ${x.m}" style="width:auto;padding:1px 6px;margin-right:6px">${x.m}</span>${x.l}</button>`).join("")}</div>
      <form id="reqForm" class="stack" style="gap:10px">
        <div class="req">
          <select id="pgMethod" aria-label="Method"><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option></select>
          <input type="text" id="pgPath" aria-label="Path" value="/students/S001" autocomplete="off" spellcheck="false">
          <button class="btn primary" type="submit">Send</button>
        </div>
        <div id="bodyWrap" hidden><label for="pgBody" style="font-size:.85rem;color:var(--muted)">Request body (JSON)</label><textarea id="pgBody" spellcheck="false"></textarea></div>
      </form>
      <div class="resp"><div class="code-h"><span>Response</span><span id="pgStatus" class="status st0">waiting</span></div><pre id="pgOut" style="margin:0;padding:14px 16px;overflow-x:auto;font-size:.84rem;min-height:120px">Press Send, or pick a preset above.</pre></div>
      <div class="confirm"><button class="btn small" id="pgReset">Reset data to the original 5 students</button></div>
    </section>
  </div>`;
  renderMissions(); syncBody();
}
function syncBody(){ const m=$("#pgMethod"); if(m) $("#bodyWrap").hidden = !(m.value==="POST"||m.value==="PUT"); }

/* ------------------------------------------------------------------ routing + events */
function go(v, push=true){
  view = v;
  if(v==="home") renderHome(); else if(v==="play") renderPlay(); else renderChapter(parseInt(v.slice(2),10));
  renderRail(); renderHeader();
  if(push){ try{ history.replaceState(null,"","#"+v); }catch(e){} }
  window.scrollTo({top:0,behavior:"auto"});
}
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const o = e.target.closest("[data-q]");
  if(o){
    const k=o.dataset.q, j=+o.dataset.o, [cid,qi]=k.split("-").map(Number), q=CH.find(c=>c.id===cid).quiz[qi];
    const st = S.quiz[k] || {tries:0, solved:false, first:false};
    st.tries++;
    if(j===q.a){
      st.solved=true; st.first = st.tries===1; S.quiz[k]=st; save();
      const box=$("#q"+k); box.querySelectorAll(".opt").forEach((b,bi)=>{ b.disabled=true; if(bi===q.a) b.classList.add("right"); });
      box.querySelector(".why").hidden=false;
      toast(st.first?`Correct! +${XP.quiz} XP`:"Correct!"); renderHeader(); checkComplete(cid);
    } else { S.quiz[k]=st; save(); o.classList.add("wrong"); o.disabled=true; toast("Not quite. Try another answer."); }
    return;
  }
  const pr = e.target.closest("[data-preset]");
  if(pr){ const x=PRESETS[+pr.dataset.preset]; $("#pgMethod").value=x.m; $("#pgPath").value=x.p; $("#pgBody").value = x.b?JSON.stringify(x.b,null,2):""; syncBody(); return; }
  if(e.target.id==="pgReset"){ DB = JSON.parse(DATASET); $("#pgOut").textContent="Data reset."; $("#pgStatus").className="status st0"; $("#pgStatus").textContent="reset"; return; }
  if(e.target.id==="resetBtn"){ $("#resetRow").innerHTML = `<span>Clear all XP, ticks and badges?</span><button class="btn small" id="resetYes" style="border-color:var(--err);color:var(--err)">Yes, reset</button><button class="btn small" id="resetNo">Cancel</button>`; return; }
  if(e.target.id==="resetYes"){ S={checks:{},quiz:{},done:{},missions:{}}; save(); toast("Progress reset"); go("home"); return; }
  if(e.target.id==="resetNo"){ renderHome(); return; }
});
document.addEventListener("change", e=>{
  if(e.target.dataset && e.target.dataset.check){
    const k=e.target.dataset.check; S.checks[k]=e.target.checked; save();
    if(e.target.checked) toast(`+${XP.check} XP`);
    renderHeader(); checkComplete(parseInt(k.split("-")[0],10));
  }
  if(e.target.id==="pgMethod") syncBody();
});
document.addEventListener("submit", e=>{
  if(e.target.id!=="reqForm") return;
  e.preventDefault();
  const [code, data] = handle($("#pgMethod").value, $("#pgPath").value.trim(), $("#pgBody").value);
  const st=$("#pgStatus"); st.textContent = code + " " + ({200:"OK",201:"Created",400:"Bad Request",404:"Not Found",405:"Method Not Allowed",422:"Unprocessable Entity"}[code]||"");
  st.className = "status " + (code<300?"st2":"st4");
  $("#pgOut").innerHTML = hl(JSON.stringify(data,null,2),"json");
});

const start = (location.hash||"").slice(1);
go(/^(home|play|ch([1-9]|10))$/.test(start) ? start : "home", false);
</script>
